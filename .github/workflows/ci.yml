name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
          cache: true
      - name: gofmt
        run: test -z "$(gofmt -l cmd internal)" || (gofmt -l cmd internal && exit 1)
      - name: vet
        run: go vet ./cmd/... ./internal/...
      - name: staticcheck
        run: |
          go install honnef.co/go/tools/cmd/staticcheck@latest
          staticcheck ./cmd/... ./internal/...
      - name: test
        run: go test ./cmd/... ./internal/...
        env:
          CGO_ENABLED: "1"
      - name: build
        run: CGO_ENABLED=0 go build ./cmd/route
