<svg xmlns="http://www.w3.org/2000/svg" width="240" height="64" viewBox="0 0 240 64" fill="none" role="img" aria-label="promptrouter">
  <!-- mark: one input node splitting to a local path (down) and a cloud path (up) -->
  <g stroke-linecap="round" stroke-linejoin="round">
    <!-- input node -->
    <circle cx="12" cy="32" r="5" fill="#c8392b"/>
    <!-- branch lines -->
    <path d="M16 30 L34 18" stroke="#c8392b" stroke-width="3"/>
    <path d="M16 34 L34 46" stroke="#5a5550" stroke-width="3"/>
    <!-- local node (kept, accent) -->
    <circle cx="40" cy="16" r="5" fill="none" stroke="#c8392b" stroke-width="3"/>
    <!-- cloud node (muted) -->
    <circle cx="40" cy="48" r="5" fill="none" stroke="#5a5550" stroke-width="3"/>
  </g>
  <!-- wordmark -->
  <text x="60" y="40" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="22" font-weight="600" fill="#e0dbd6" letter-spacing="-0.5">promptrouter</text>
</svg>
